name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pantryops_user
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pantryops
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U pantryops_user -d pantryops"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: pantryops
      POSTGRES_USER: pantryops_user
      POSTGRES_PASSWORD: postgres
      PYTHONPATH: .

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for Postgres
        run: |
          until pg_isready -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
            echo "Waiting for Postgres..."
            sleep 2
          done
        env:
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}

      - name: Start Flask server
        run: |
          python -m src.server &

      - name: Wait for Flask server
        run: |
          for i in {1..5}; do
            echo "Attempt $i: checking Flask health..."
            if curl -f http://127.0.0.1:5000/health; then
              echo "Flask is up!"
              exit 0
            fi
            sleep 2
          done

          echo "Flask failed to start after 5 attempts"
          exit 1

      - name: Run tests
        run: |
          python -m unittest discover -s tests -p "test_*.py"